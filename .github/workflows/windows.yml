name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Fetch ffmpeg and the speech model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/ffmpeg, models | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          Get-ChildItem ffmpeg-src -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
          Get-ChildItem ffmpeg-src -Recurse -Filter LICENSE* | Select-Object -First 1 | Copy-Item -Destination packaging/ffmpeg/LICENSE.txt
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin -OutFile models/ggml-small-q5_1.bin

      - name: Build
        run: |
          uv sync --group build
          uv run pyinstaller --noconfirm packaging/saltyrec.spec

      - name: Self-test the built app
        timeout-minutes: 12
        shell: pwsh
        run: |
          $p = Start-Process dist/SaltyRec/SaltyRecCheck.exe -ArgumentList "--selftest", "$PWD\selftest.json" `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt -NoNewWindow -PassThru
          $done = $p.WaitForExit(600000)
          if (-not $done) { Stop-Process $p -Force }
          Write-Host "--- stdout"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr"; Get-Content err.txt -ErrorAction SilentlyContinue
          Write-Host "--- report"; Get-Content selftest.json -ErrorAction SilentlyContinue
          if (-not $done) { throw "self-test hung" }
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/SaltyRec/* SaltyRec-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SaltyRec-Windows
          path: SaltyRec-Windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SaltyRec-Windows.zip
